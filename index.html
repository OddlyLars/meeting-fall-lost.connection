<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE_FILE_08</title>
  <style>
    body {
      background-color: #050505;
      color: #999;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    .container {
      text-align: center;
      max-width: 700px;
      padding: 20px;
      z-index: 2;
    }

    h1 {
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: #444;
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      max-width: 600px;
      border: 1px solid #222;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    /* Hidden secret text style */
    .hidden-clue {
      margin-top: 30px;
      color: #050505; /* Matches background so it's invisible until highlighted */
      font-size: 0.8rem;
      cursor: default;
      transition: color 0.3s;
    }

    .hidden-clue:hover {
      color: #333; /* Becomes faintly visible on hover */
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>

  <div class="container">
    <h1>[ FILE LOADED: SUCCESS ]</h1>
    
    <!-- Video Player linked to cassettekevin.mp4 -->
    <video controls preload="metadata">
      <source src="cassettekevin.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <!-- Hidden ARG element -->
    <div class="hidden-clue">
      they are still listening. don't look behind you.
    </div>
  </div>

</body>
</html>
