<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE_FILE_08</title>
  <style>
    body {
      background-color: #050505;
      color: #999;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 10;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 1000px;
      padding: 10px;
      z-index: 2;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      border: 1px solid #222;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
      margin-bottom: 25px;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    /* Cassette Player Decoration */
    .cassette-deck {
      display: inline-block;
      background: #111;
      border: 2px solid #222;
      padding: 15px 25px;
      border-radius: 6px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      margin-top: 10px;
    }

    .cassette-label {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #555;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .cassette-body {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 10px 20px;
      border-radius: 4px;
    }

    .reel {
      width: 28px;
      height: 28px;
      border: 3px dashed #555;
      border-radius: 50%;
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .tape-window {
      width: 70px;
      height: 16px;
      background: #080808;
      border: 1px solid #333;
      border-radius: 3px;
    }

    .hidden-clue {
      margin-top: 25px;
      color: #050505; /* Matches background so it's invisible until hovered */
      font-size: 0.85rem;
      cursor: default;
      transition: color 0.3s;
    }

    .hidden-clue:hover {
      color: #333; /* Becomes visible on hover */
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>

  <div class="container">
    <!-- YouTube Embed Player -->
    <div class="video-wrapper">
      <iframe src="https://www.youtube.com/embed/M53iQHE7nlc" title="Transmission" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Cassette Player Graphic Decoration -->
    <div class="cassette-deck">
      <div class="cassette-label">DECK-A // CASSETTEKEVIN.MP4</div>
      <div class="cassette-body">
        <div class="reel"></div>
        <div class="tape-window"></div>
        <div class="reel"></div>
      </div>
    </div>

    <!-- Hidden ARG element -->
    <div class="hidden-clue">
      It's listening.
    </div>
  </div>

</body>
</html>
